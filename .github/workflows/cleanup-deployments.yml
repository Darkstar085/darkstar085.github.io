name: Cleanup old deployments

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete inactive deployments older than this many days"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      RETENTION_DAYS: ${{ inputs.older_than_days || '7' }}

    steps:
      - name: Validate GH_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN secret is not configured."
            exit 1
          fi

      - name: Delete old inactive deployments
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          echo "Removing inactive deployments created before $(date -u -d "@${cutoff}")"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPOSITORY}/deployments?per_page=100" \
            --jq '.[] | [.id, .created_at] | @tsv' |
          while IFS=$'\t' read -r deployment_id created_at; do
            created_ts="$(date -u -d "$created_at" +%s)"

            if [ "$created_ts" -ge "$cutoff" ]; then
              continue
            fi

            state="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
              --jq '.[0].state // "unknown"')"

            if [ "$state" = "inactive" ]; then
              echo "Deleting inactive deployment ${deployment_id} (${created_at})"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${REPOSITORY}/deployments/${deployment_id}"
            else
              echo "Keeping deployment ${deployment_id}: latest status is ${state}"
            fi
          done
