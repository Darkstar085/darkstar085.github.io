name: Sync featured projects

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync top 5 repositories
        run: python scripts/sync_projects.py

      - name: Commit updated project list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --cached --quiet || git commit -m "chore: sync featured GitHub projects"
          git push
