name: Cleanup old GitHub Pages deployments

on:
  schedule:
    # Runs once a week: Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete Pages deployments older than 7 days, keep latest 3
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: "github-pages",
                per_page: 100
              }
            );

            deployments.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );

            const keep = new Set(
              deployments.slice(0, 3).map(deployment => deployment.id)
            );

            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;

            let deleted = 0;
            for (const deployment of deployments) {
              const createdAt = new Date(deployment.created_at).getTime();

              if (keep.has(deployment.id) || createdAt >= cutoff) {
                continue;
              }

              try {
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: deployment.id
                });

                deleted++;
                core.info(
                  `Deleted deployment ${deployment.id} created at ${deployment.created_at}`
                );
              } catch (error) {
                core.warning(
                  `Could not delete deployment ${deployment.id}: ${error.message}`
                );
              }
            }

            core.info(
              `Cleanup complete: ${deleted} old deployment(s) deleted; latest 3 preserved.`
            );
